[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sofr-cap-forward-volatility"
version = "0.1.0"
description = "Research package for stripping SOFR cap forward volatility and testing rates-vol risk premia."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "nbformat",
  "numpy",
  "openpyxl",
  "pandas",
  "scikit-learn",
  "scipy",
  "statsmodels",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
